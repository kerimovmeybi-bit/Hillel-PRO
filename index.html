<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Weather Widget</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <h1 class="title">Home-Work 19.1</h1>
    <div class="weather-widget">
        <div class="left">
            <div class="date" id="date"></div>
            <div class="time" id="time"></div>

            <p>Вологість: <span id="humidity"></span>%</p>
            <p>Тиск: <span id="pressure"></span> hPa</p>
            <p>Вітер: <span id="wind"></span> м/с</p>
        </div>

        <div class="right">
            <img id="icon" alt="weather icon">
            <div class="temp"><span id="temp"></span>°C</div>
            <div class="desc" id="description"></div>
            <button id="refresh">🔄 Оновити</button>
        </div>
    </div>

    <script src="./js/scripts.js"></script>
</body>

</html>
